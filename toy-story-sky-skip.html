<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toy Story Sky Skip</title>
  <style>
    :root { --ink:#2d2650; --cream:#fff8d8; --purple:#6c4cc9; --sky:#78d6f4; }
    * { box-sizing:border-box; } body { margin:0; min-width:300px; min-height:100vh; display:grid; place-items:center; overflow:hidden; color:var(--ink); font-family:"Courier New",monospace; background:#44387e radial-gradient(#685a9e 1px,transparent 1px); background-size:12px 12px; }
    .page { width:min(100%,530px); padding:16px; }.game-shell { border:6px solid var(--ink); box-shadow:0 8px #211b40,0 16px 30px #211b4080; }.game { --ground:74px; position:relative; width:100%; aspect-ratio:2/3; max-height:78vh; overflow:hidden; isolation:isolate; cursor:pointer; background:linear-gradient(var(--sky),#c9f5f2); }
    .game::before,.game::after { content:""; position:absolute; z-index:-1; width:100%; height:17px; background:#fff5b6; opacity:.55; }.game::before { top:27%; box-shadow:22px 17px #fff5b6,-50px 36px #fff5b6; }.game::after { top:58%; box-shadow:60px 17px #fff5b6,-30px 34px #fff5b6; }
    .cloud { position:absolute; z-index:-1; width:70px; height:20px; background:#f8ffff; opacity:.86; }.cloud::before,.cloud::after { content:""; position:absolute; background:inherit; }.cloud::before { width:35px;height:35px;bottom:0;left:10px; }.cloud::after { width:25px;height:25px;bottom:0;right:8px; }.one{top:18%;left:9%;animation:drift 12s linear infinite}.two{top:43%;right:7%;scale:.65;animation:drift 16s -8s linear infinite}
    .hud { position:absolute; z-index:10; top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none; }.score-card { min-width:84px;padding:5px 9px 7px;text-align:center;border:3px solid var(--ink);background:var(--cream);box-shadow:3px 3px #9a8ac0; }.score-card span { display:block;font-size:11px;font-weight:bold;text-transform:uppercase; }.score-card strong { display:block;font-size:25px;line-height:1;color:#3e2b81; }
    .player { position:absolute;z-index:5;width:58px;height:52px;object-fit:contain;filter:drop-shadow(3px 4px 0 #2d2650);transform-origin:center;user-select:none;-webkit-user-drag:none; }.player.idle { animation:bob .7s ease-in-out infinite alternate; }
    .obstacle { position:absolute;z-index:3;width:76px;min-height:70px;border:5px solid var(--ink);background:repeating-linear-gradient(90deg,#5cbd75 0 16px,#99e56d 16px 28px);filter:drop-shadow(3px 4px 0 #2d2650); }.obstacle::after { content:"";position:absolute;left:-10px;right:-10px;height:17px;background:linear-gradient(90deg,#ffed5c 0 20%,#ff9c5b 20% 40%,#ffed5c 40% 60%,#ff9c5b 60% 80%,#ffed5c 80%);border:5px solid var(--ink); }.obstacle.top { top:0;transform:rotate(180deg);transform-origin:center; }.obstacle.top::after { top:-5px; }.obstacle.bottom { bottom:var(--ground); }.obstacle.bottom::after { top:-5px; }
    .ground { position:absolute;z-index:6;bottom:0;width:100%;height:var(--ground);border-top:5px solid var(--ink);background:repeating-linear-gradient(90deg,#e89948 0 13px,#f4b75a 13px 26px); }.grass { height:17px;margin-top:-17px;border-top:4px solid var(--ink);background:repeating-linear-gradient(90deg,#62c967 0 8px,#97e36e 8px 16px); }
    .screen { position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;text-align:center;background:#78d6f4e8;transition:opacity .18s,visibility .18s; }.start{background:linear-gradient(#78d6f4e8,#c9f5f2e8)}.hidden{visibility:hidden;opacity:0;pointer-events:none}.eyebrow{margin:0 0 10px;font-size:12px;font-weight:bold;text-transform:uppercase}h1,h2{margin:0;text-transform:uppercase;letter-spacing:-3px;text-shadow:3px 3px var(--cream)}h1{font-size:clamp(46px,12vw,68px);line-height:.9}h1 span{color:#e55376}h2{font-size:clamp(34px,9vw,52px)}.message{max-width:310px;margin:8px 0 0;font-size:13px;line-height:1.4}.picker{display:flex;flex-wrap:wrap;justify-content:center;max-width:350px;gap:7px;margin:5px 0}.choice{width:62px;min-height:80px;padding:4px 2px;border:3px solid var(--ink);color:var(--ink);font-family:inherit;font-size:9px;font-weight:bold;background:var(--cream);box-shadow:3px 3px #9a8ac0;cursor:pointer}.choice img{display:block;width:45px;height:48px;margin:0 auto 2px;image-rendering:pixelated}.choice:hover,.choice:focus-visible,.choice.selected{color:white;background:var(--purple);outline:3px solid white;outline-offset:2px}.choice.selected{box-shadow:3px 3px var(--ink)}.primary{margin:10px 0;padding:13px 24px;border:4px solid var(--ink);color:white;font:700 18px "Courier New",monospace;text-transform:uppercase;background:#e55376;box-shadow:5px 5px var(--ink);cursor:pointer}.primary:hover,.primary:focus-visible{background:#c83e62;outline:3px solid white;outline-offset:3px}.primary:active{transform:translate(3px,3px);box-shadow:2px 2px var(--ink)}.hint{margin:3px 0 0;font-size:11px;font-weight:bold}kbd{padding:1px 4px;border:2px solid var(--ink);background:var(--cream)}.round{margin:18px 0 0;font-size:17px}.round strong{color:#e55376;font-size:30px}.note{margin:17px 0 0;color:#f8f3d8;text-align:center;font-size:11px}@keyframes bob{to{transform:translateY(8px) rotate(-4deg)}}@keyframes drift{to{transform:translateX(25px)}}
    @media(max-width:410px),(max-height:650px){.page{padding:7px}.game{--ground:58px}.game-shell{border-width:4px}.hud{top:8px;left:8px;right:8px}.score-card{min-width:68px;padding:3px 6px 5px}.score-card strong{font-size:20px}.player{width:51px;height:46px}.obstacle{width:66px}.choice{width:55px;min-height:73px}.choice img{width:40px;height:43px}.note{display:none}}
  </style>
</head>
<body>
  <main class="page"><section class="game-shell"><div id="game" class="game" role="application" aria-label="Tap, click, or press space to fly">
    <div class="cloud one"></div><div class="cloud two"></div>
    <div class="hud" aria-live="polite"><div class="score-card"><span>Score</span><strong id="score">0</strong></div><div class="score-card"><span>Best</span><strong id="best">0</strong></div></div>
    <div id="obstacles" aria-hidden="true"></div><img id="player" class="player" alt="Woody"><div class="ground"><div class="grass"></div></div>
    <div id="start" class="screen start"><p class="eyebrow">Choose your Toy Story skipper</p><h1>Sky <span>Skip</span></h1><div class="picker" role="radiogroup" aria-label="Choose a character">
      <button class="choice selected" type="button" data-character="woody" role="radio" aria-checked="true"><img alt=""><span>Woody</span></button>
      <button class="choice" type="button" data-character="buzz" role="radio" aria-checked="false"><img alt=""><span>Buzz</span></button>
      <button class="choice" type="button" data-character="jessie" role="radio" aria-checked="false"><img alt=""><span>Jessie</span></button>
      <button class="choice" type="button" data-character="rex" role="radio" aria-checked="false"><img alt=""><span>Rex</span></button>
      <button class="choice" type="button" data-character="alien" role="radio" aria-checked="false"><img alt=""><span>Alien</span></button>
    </div><p id="message" class="message">Woody is ready to skip!</p><button id="play" class="primary" type="button">Play</button><p class="hint">Tap, click, or press <kbd>Space</kbd> to flap</p></div>
    <div id="over" class="screen hidden" aria-live="assertive"><p class="eyebrow">That was a close one!</p><h2>Flight over</h2><p class="round">Score <strong id="final">0</strong></p><button id="restart" class="primary" type="button">Fly again</button><p class="hint">Tap, click, or press <kbd>Space</kbd> to restart</p></div>
  </div></section><p class="note">Standalone HTML game — no installation needed.</p></main>
  <script>
    // Sprite strings live here so this is a single, portable HTML file.
    const sprites={
      woody:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 58" shape-rendering="crispEdges"><path fill="#242039" d="M8 4h36v8h4v28h-4v8h-8v6H16v-6H8v-8H4V12h4z"/><path fill="#9b5a31" d="M8 4h36v8H8z"/><path fill="#e5b57f" d="M12 14h28v22H12z"/><path fill="#f5df96" d="M16 8h20v8H16z"/><path fill="#242039" d="M16 20h8v4h-8zm16 0h4v4h-4zm-12 10h12v4H20z"/><path fill="#edc335" d="M12 36h28v10H12z"/><path fill="#d84b47" d="M16 40h20v6H16z"/><path fill="#3e74b7" d="M16 46h20v8H16z"/></svg>`,
      buzz:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 58" shape-rendering="crispEdges"><path fill="#242039" d="M12 4h28v4h8v8h4v24h-4v8h-8v6H12v-6H4v-8H0V16h4V8h8z"/><path fill="#f4f4e9" d="M16 8h20v4h8v8h4v16h-4v8h-8v6H16v-6H8v-8H4V16h4V12h8z"/><path fill="#a47bd4" d="M12 12h8v8h-8zm20 0h8v8h-8zM12 40h28v6H12z"/><path fill="#76c77d" d="M20 8h12v16H20z"/><path fill="#242039" d="M20 20h4v4h-4zm8 0h4v4h-4zm-4 8h4v4h-4z"/><path fill="#e34f5d" d="M20 32h12v6H20z"/></svg>`,
      jessie:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 58" shape-rendering="crispEdges"><path fill="#242039" d="M8 4h36v4h4v12h4v20h-4v8h-8v6H12v-6H4v-8H0V20h4V8h4z"/><path fill="#dc6c35" d="M8 4h36v12h-8V12H16v4H8z"/><path fill="#f3c596" d="M12 16h28v20H12z"/><path fill="#fff7db" d="M12 12h28v4H12z"/><path fill="#242039" d="M16 22h8v4h-8zm16 0h4v4h-4zm-12 10h12v4H20z"/><path fill="#fff7db" d="M12 36h28v10H12z"/><path fill="#4c93c7" d="M16 46h20v8H16z"/><path fill="#dc6c35" d="M12 40h8v6h-8zm20 0h8v6h-8z"/></svg>`,
      rex:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 58" shape-rendering="crispEdges"><path fill="#242039" d="M8 4h28v4h8v8h4v24h-4v8h-8v6H12v-6H4v-8H0V16h4V8h4z"/><path fill="#73bf70" d="M12 8h24v4h8v8h-4v20h-8v8H12v-4H8V36H4V16h8z"/><path fill="#9bdb78" d="M12 12h20v20H12z"/><path fill="#242039" d="M24 16h8v4h-8zm4 8h8v4h-8zm-12 4h20v8H16z"/><path fill="#fff8d8" d="M24 28h8v4h-8z"/><path fill="#73bf70" d="M16 44h8v10h-8zm16 0h8v10h-8z"/></svg>`,
      alien:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 58" shape-rendering="crispEdges"><path fill="#242039" d="M12 4h28v4h8v8h4v20h-4v8h-8v6H12v-6H4v-8H0V16h4V8h8z"/><path fill="#75bd70" d="M16 8h20v4h8v8h4v16h-4v8h-8v6H16v-6H8v-8H4V16h4v-4h8z"/><path fill="#a8e282" d="M16 12h20v24H16z"/><path fill="#242039" d="M16 20h4v8h-4zm8 0h4v8h-4zm8 0h4v8h-4zm-12 12h12v4H20z"/><path fill="#537bb6" d="M12 38h28v8H12z"/><path fill="#fff8d8" d="M16 46h20v8H16z"/></svg>`
    };
    const $=id=>document.getElementById(id),game=$("game"),player=$("player"),layer=$("obstacles"),scoreNode=$("score"),bestNode=$("best"),start=$("start"),over=$("over"),final=$("final"),message=$("message"),choices=[...document.querySelectorAll(".choice")];
    const settings={x:72,w:48,h:40,g:.34,flap:-6.4,gap:142,obstacle:76,speed:2.45,spawn:1450};let y=0,v=0,score=0,best=Number(localStorage.getItem("toySkySkipBest")||0),obstacles=[],running=false,last=0,timer=0,frame=0,character="woody";bestNode.textContent=best;
    const src=id=>"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(sprites[id]);
    function tone(f,d,type="square",volume=.045){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=new C(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);g.gain.setValueAtTime(volume,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}
    function setPlayer(){player.style.left=settings.x+"px";player.style.top=y+"px";player.style.transform=`rotate(${Math.max(-22,Math.min(75,v*7))}deg)`}function clear(){obstacles.forEach(p=>p.nodes.forEach(n=>n.remove()));obstacles=[]}function choose(button){character=button.dataset.character;player.src=src(character);player.alt=button.innerText;message.textContent=button.innerText+" is ready to skip!";choices.forEach(b=>{const on=b===button;b.classList.toggle("selected",on);b.setAttribute("aria-checked",on)});tone(470,.05,"triangle",.03)}
    function startGame(){cancelAnimationFrame(frame);clear();y=game.clientHeight*.42;v=0;score=0;timer=0;last=performance.now();running=true;scoreNode.textContent=score;player.classList.remove("idle");start.classList.add("hidden");over.classList.add("hidden");setPlayer();flap();frame=requestAnimationFrame(loop)}function flap(){if(!running)return;v=settings.flap;tone(570,.07)}
    function add(){const ground=parseFloat(getComputedStyle(game).getPropertyValue("--ground")),height=game.clientHeight-ground,top=76+Math.floor(Math.random()*Math.max(1,height-settings.gap-161)),a=document.createElement("div"),b=document.createElement("div");a.className="obstacle top";b.className="obstacle bottom";a.style.height=top+"px";b.style.height=(height-top-settings.gap)+"px";layer.append(a,b);obstacles.push({x:game.clientWidth+5,scored:false,nodes:[a,b]})}const hit=(a,b)=>a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
    function loop(now){if(!running)return;const delta=now-last,m=Math.min(2,delta/16.67);last=now;v+=settings.g*m;y+=v*m;setPlayer();timer+=delta;if(timer>settings.spawn){add();timer=0}const rect=player.getBoundingClientRect();for(let i=obstacles.length-1;i>=0;i--){const p=obstacles[i];p.x-=settings.speed*m;p.nodes.forEach(n=>n.style.left=p.x+"px");if(!p.scored&&p.x+settings.obstacle<settings.x){p.scored=true;score++;scoreNode.textContent=score;tone(820,.09,"triangle",.06)}if(p.x+settings.obstacle<-8){p.nodes.forEach(n=>n.remove());obstacles.splice(i,1);continue}if(p.nodes.some(n=>hit(rect,n.getBoundingClientRect())))return end()}const ground=parseFloat(getComputedStyle(game).getPropertyValue("--ground"));if(y<-10||y+settings.h>game.clientHeight-ground)return end();frame=requestAnimationFrame(loop)}
    function end(){running=false;tone(130,.3,"sawtooth",.08);if(score>best){best=score;localStorage.setItem("toySkySkipBest",best);bestNode.textContent=best}final.textContent=score;over.classList.remove("hidden")}function action(e){if(e?.target?.closest("button"))return;if(running)flap();else if(start.classList.contains("hidden"))startGame()}
    choices.forEach(b=>{b.querySelector("img").src=src(b.dataset.character);b.addEventListener("click",()=>choose(b))});choose(choices[0]);$("play").addEventListener("click",startGame);$("restart").addEventListener("click",startGame);game.addEventListener("pointerdown",action);window.addEventListener("keydown",e=>{if(e.code!=="Space")return;e.preventDefault();running?flap():startGame()});y=game.clientHeight*.42;player.classList.add("idle");setPlayer();
  </script>
</body>
</html>
